<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Детектор злости v4</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      min-height:100vh;color:#fff;padding:14px;display:flex;flex-direction:column;align-items:center}
 h1{font-size:19px;margin-bottom:6px}
 .wrap{width:100%;max-width:400px}
 #status{padding:9px 14px;background:rgba(0,0,0,.35);border-radius:9px;margin:8px 0;text-align:center;font-size:13px}
 #indicator{width:190px;height:190px;border-radius:50%;background:#555;margin:10px auto;display:flex;
   align-items:center;justify-content:center;font-size:62px;transition:background .12s,box-shadow .12s;
   box-shadow:0 0 28px rgba(0,0,0,.5)}
 #indicator.green{background:#43A047;box-shadow:0 0 48px #43A047}
 #indicator.yellow{background:#FFB300;box-shadow:0 0 48px #FFB300}
 #indicator.red{background:#E53935;box-shadow:0 0 66px #E53935;animation:pulse .45s infinite}
 @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
 .btn-row{display:flex;gap:10px;justify-content:center;margin:8px 0}
 button{padding:11px 22px;font-size:15px;border:none;border-radius:20px;cursor:pointer;font-weight:bold}
 #startBtn{background:#43A047;color:#fff}#stopBtn{background:#E53935;color:#fff;display:none}
 button:hover{filter:brightness(1.12)}
 .panel{background:rgba(0,0,0,.3);border-radius:10px;padding:10px;margin-top:10px}
 .prob-row{display:flex;justify-content:space-between;font-size:13px;margin:2px 0}
 .prob-bar{height:15px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin:2px 0 6px}
 .prob-fill{height:100%;transition:width .12s;border-radius:8px}
 #vol-meter{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:6px 0}
 #vol-fill{height:100%;width:0;background:#00e676;transition:width .08s}
 label.sl{display:flex;justify-content:space-between;font-size:12.5px;margin:9px 0 2px;color:#dbe7ee}
 label.sl b{color:#7fdbff;font-weight:600}
 input[type=range]{width:100%;accent-color:#4fc3f7}
 .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:7px 0;color:#dbe7ee}
 .chk input{width:17px;height:17px;accent-color:#4fc3f7}
 details summary{cursor:pointer;font-size:14px;font-weight:bold;padding:6px 0;outline:none}
 .presets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
 .presets button{padding:7px 11px;font-size:11.5px;border-radius:14px;background:#37474F;color:#fff}
 .presets button.active{background:#0288D1}
 #debug{margin-top:8px;padding:6px 9px;background:rgba(0,0,0,.35);border-radius:8px;
   font-size:10px;font-family:monospace;line-height:1.5;min-height:34px;color:#b0e0ff}
 hr{border:none;border-top:1px solid rgba(255,255,255,.12);margin:10px 0}
</style>
</head>
<body>
<h1>🎤 Детектор злости v4</h1>
<div class="wrap">
 <div id="status">⏳ Загрузка модели...</div>
 <div id="indicator">⚪</div>
 <div id="vol-meter"><div id="vol-fill"></div></div>
 <div class="btn-row">
   <button id="startBtn" disabled>▶️ Начать</button>
   <button id="stopBtn">⏹ Стоп</button>
 </div>
 <div class="panel">
  <div class="prob-row"><span>🟢 Спокойно</span><span id="p0">—</span></div>
  <div class="prob-bar"><div id="b0" class="prob-fill" style="background:#43A047;width:0"></div></div>
  <div class="prob-row"><span>🟡 Раздражение</span><span id="p1">—</span></div>
  <div class="prob-bar"><div id="b1" class="prob-fill" style="background:#FFB300;width:0"></div></div>
  <div class="prob-row"><span>🔴 Сильная злость</span><span id="p2">—</span></div>
  <div class="prob-bar"><div id="b2" class="prob-fill" style="background:#E53935;width:0"></div></div>
 </div>
 <div class="panel">
  <div class="presets">
   <button data-p="v2" class="active">🛡 Стабильный</button>
   <button data-p="fast">⚡ Быстрый</button>
   <button data-p="sharp">🔥 Острый</button>
   <button data-p="quiet">🤫 Тихая комната</button>
   <button data-p="noisy">🏙 Шумно</button>
  </div>
  <details open>
   <summary>⚙️ Основные настройки</summary>
   <label class="sl"><span>Чувствительность</span><b><span id="v_sens">7</span>/10</b></label>
   <input type="range" id="sens" min="1" max="10" step="1" value="7">
   <label class="sl"><span>🔥 Усиление злости</span><b><span id="v_boost">0</span>/10</b></label>
   <input type="range" id="boost" min="0" max="10" step="1" value="0">
   <label class="sl"><span>⏱ Частота обновления</span><b><span id="v_rate">400</span> мс</b></label>
   <input type="range" id="rate" min="150" max="1500" step="50" value="400">
   <label class="sl"><span>🌊 Инерция</span><b><span id="v_smooth">35</span>%</b></label>
   <input type="range" id="smooth" min="0" max="90" step="5" value="35">
  </details>
  <hr>
  <details>
   <summary>🔧 Фильтры и защита</summary>
   <label class="sl"><span>🔇 Порог тишины</span><b><span id="v_gate">0.005</span></b></label>
   <input type="range" id="gate" min="1" max="60" step="1" value="5">
   <label class="sl"><span>🎚 Мин. громкость для 🔴</span><b><span id="v_minred">выкл</span></b></label>
   <input type="range" id="minred" min="0" max="60" step="1" value="0">
   <label class="sl"><span>✔ Подтверждений для 🔴</span><b><span id="v_conf">1</span></b></label>
   <input type="range" id="conf" min="1" max="5" step="1" value="1">
   <label class="sl"><span>⏳ Удержание 🔴</span><b><span id="v_hold">0.0</span> с</b></label>
   <input type="range" id="hold" min="0" max="50" step="1" value="0">
   <div class="chk"><input type="checkbox" id="norm" checked><label for="norm">📏 Нормализация громкости</label></div>
   <div class="chk"><input type="checkbox" id="hpf"><label for="hpf">🎛 High-pass 80 Гц</label></div>
   <div class="chk"><input type="checkbox" id="vad"><label for="vad">✂️ VAD (может давать ложные)</label></div>
   <div class="chk"><input type="checkbox" id="snd" checked><label for="snd">🔊 Звук при 🔴</label></div>
  </details>
  <hr>
  <div class="btn-row"><button id="resetBtn" style="background:#546E7A;font-size:12px;padding:8px 16px">↺ Сброс</button></div>
 </div>
 <div id="debug">📊 ...</div>
</div>

function readUI(){ids.forEach(k=>S[k]=parseInt(document.getElementById(k).value));cbs.forEach(k=>S[k]=document.getElementById(k).checked?1:0);document.getElementById('v_sens').textContent=S.sens;document.getElementById('v_boost').textContent=S.boost;document.getElementById('v_rate').textContent=S.rate;document.getElementById('v_smooth').textContent=S.smooth;document.getElementById('v_gate').textContent=gv(S.gate).toFixed(3);document.getElementById('v_minred').textContent=S.minred===0?'выкл':gv(S.minred).toFixed(3);document.getElementById('v_conf').textContent=S.conf;document.getElementById('v_hold').textContent=(S.hold/10).toFixed(1);localStorage.setItem('ac',JSON.stringify(S))}
function applyCfg(c){ids.forEach(k=>{if(c[k]!==undefined)document.getElementById(k).value=c[k]});cbs.forEach(k=>{if(c[k]!==undefined)document.getElementById(k).checked=!!c[k]});readUI()}
ids.concat(cbs).forEach(k=>document.getElementById(k).addEventListener('input',readUI));
document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.presets button').forEach(x=>x.classList.remove('active'));b.classList.add('active');applyCfg(Object.assign({},PRESETS[b.dataset.p],{snd:S.snd}))});
document.getElementById('resetBtn').onclick=()=>{applyCfg(DEF);document.querySelectorAll('.presets button').forEach(x=>x.classList.remove('active'));document.querySelector('.presets button[data-p=v2]').classList.add('active')};
const sv=localStorage.getItem('ac');applyCfg(sv?JSON.parse(sv):DEF);
function beep(){if(!S.snd||isAlarming)return;isAlarming=true;try{if(!alarmCtx)alarmCtx=new AudioContext();const o=alarmCtx.createOscillator(),g=alarmCtx.createGain(),t=alarmCtx.currentTime;o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(660,t+.1);o.frequency.setValueAtTime(880,t+.2);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.connect(g);g.connect(alarmCtx.destination);o.start();o.stop(t+.3)}catch(e){}setTimeout(()=>isAlarming=false,1500)}
function hzToMel(h){return 2595*Math.log10(1+h/700)}function melToHz(m){return 700*(Math.pow(10,m/2595)-1)}
function mkFB(nM,nF,sr){const a=hzToMel(0),b=hzToMel(sr/2),p=new Float32Array(nM+2);for(let i=0;i<nM+2;i++)p[i]=a+(b-a)*i/(nM+1);const bp=Array.from(p).map(melToHz).map(h=>Math.floor((nF+1)*h/sr)),fb=[];for(let m=1;m<=nM;m++){const f=new Float32Array(nF/2+1);for(let k=bp[m-1];k<bp[m];k++)f[k]=(k-bp[m-1])/(bp[m]-bp[m-1]+1e-9);for(let k=bp[m];k<bp[m+1];k++)f[k]=(bp[m+1]-k)/(bp[m+1]-bp[m]+1e-9);fb.push(f)}return fb}
const FB=mkFB(N_MELS,N_FFT,SR),HANN=new Float32Array(N_FFT);for(let i=0;i<N_FFT;i++)HANN[i]=.5*(1-Math.cos(2*Math.PI*i/(N_FFT-1)));
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}for(let L=2;L<=n;L<<=1){const a=-2*Math.PI/L,cr=Math.cos(a),ci=Math.sin(a);for(let i=0;i<n;i+=L){let wr=1,wi=0;for(let k=0;k<L/2;k++){const xr=re[i+k],xi=im[i+k],yr=re[i+k+L/2]*wr-im[i+k+L/2]*wi,yi=re[i+k+L/2]*wi+im[i+k+L/2]*wr;re[i+k]=xr+yr;im[i+k]=xi+yi;re[i+k+L/2]=xr-yr;im[i+k+L/2]=xi-yi;const t=wr*cr-wi*ci;wi=wr*ci+wi*cr;wr=t}}}}
function hp(x){const a=.978,y=new Float32Array(x.length);y[0]=x[0];for(let i=1;i<x.length;i++)y[i]=a*(y[i-1]+x[i]-x[i-1]);return y}
function melSpec(sig){let s=sig;if(S.hpf)s=hp(s);if(S.norm){let r=0;for(let i=0;i<s.length;i++)r+=s[i]*s[i];r=Math.sqrt(r/s.length);const g=r>.001?.05/r:1,o=new Float32Array(s.length);for(let i=0;i<s.length;i++)o[i]=s[i]*g;s=o}const nF=Math.floor((s.length-N_FFT)/HOP)+1,mel=Array.from({length:N_MELS},()=>new Float32Array(nF));for(let t=0;t<nF;t++){const re=new Float32Array(N_FFT),im=new Float32Array(N_FFT);for(let i=0;i<N_FFT;i++)re[i]=s[t*HOP+i]*HANN[i];fft(re,im);const pw=new Float32Array(N_FFT/2+1);for(let k=0;k<=N_FFT/2;k++)pw[k]=re[k]*re[k]+im[k]*im[k];for(let m=0;m<N_MELS;m++){let v=0;for(let k=0;k<pw.length;k++)v+=FB[m][k]*pw[k];mel[m][t]=v}}let sum=0,cnt=N_MELS*nF;for(let m=0;m<N_MELS;m++)for(let t=0;t<nF;t++){mel[m][t]=Math.log(mel[m][t]+1e-9);sum+=mel[m][t]}const mu=sum/cnt;let v2=0;for(let m=0;m<N_MELS;m++)for(let t=0;t<nF;t++)v2+=(mel[m][t]-mu)**2;const sd=Math.sqrt(v2/cnt)+1e-8,out=new Float32Array(N_MELS*MAX_LEN);for(let m=0;m<N_MELS;m++)for(let t=0;t<MAX_LEN;t++)out[m*MAX_LEN+t]=t<nF?(mel[m][t]-mu)/sd:0;return out}
function vadCrop(full){const fs=1024,n=Math.floor(full.length/fs),rms=[];let mx=0;for(let f=0;f<n;f++){let s=0;for(let i=0;i<fs;i++){const v=full[f*fs+i];s+=v*v}const r=Math.sqrt(s/fs);rms.push(r);if(r>mx)mx=r}const th=mx*.15;let a=0,b=n-1;while(a<n&&rms[a]<th)a++;while(b>a&&rms[b]<th)b--;a=Math.max(0,a-2);b=Math.min(n-1,b+2);const v=full.slice(a*fs,Math.min(full.length,(b+1)*fs));if(v.length>=WIN)return v.slice(0,WIN);const p=new Float32Array(WIN);p.set(v,Math.floor((WIN-v.length)/2));return p}
async function loadModel(){try{const bin=atob(MODEL_B64),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);session=await ort.InferenceSession.create(buf.buffer,{executionProviders:['wasm']});document.getElementById('status').textContent='✅ Модель загружена!';document.getElementById('startBtn').disabled=false}catch(e){document.getElementById('status').textContent='❌ '+e.message}}
function applyBoost(p){if(S.boost===0)return p.slice();const w=[1,1+S.boost*.35,1+S.boost*.6],q=[p[0]*w[0],p[1]*w[1],p[2]*w[2]],s=q[0]+q[1]+q[2];return[q[0]/s,q[1]/s,q[2]/s]}
async function predict(sig,rms,info){if(busy)return;busy=true;const t0=performance.now();try{const mel=melSpec(sig),tn=new ort.Tensor('float32',mel,[1,N_MELS,MAX_LEN,1]),fd={};fd[session.inputNames[0]]=tn;const res=await session.run(fd),raw=Array.from(res[session.outputNames[0]].data),bst=applyBoost(raw),k=S.smooth/100;for(let i=0;i<3;i++)smoothProbs[i]=k*smoothProbs[i]+(1-k)*bst[i];updateUI(smoothProbs,raw,rms,(performance.now()-t0)|0,info)}catch(e){console.error(e)}busy=false}
function updateUI(sp,raw,rms,ms,info){const[p0,p1,p2]=sp;document.getElementById('p0').textContent=(p0*100).toFixed(1)+'%';document.getElementById('p1').textContent=(p1*100).toFixed(1)+'%';document.getElementById('p2').textContent=(p2*100).toFixed(1)+'%';document.getElementById('b0').style.width=(p0*100)+'%';document.getElementById('b1').style.width=(p1*100)+'%';document.getElementById('b2').style.width=(p2*100)+'%';const rT=.80-(S.sens-1)*.04,yT=.50-(S.sens-1)*.04,anger=p1+p2,rR=(p2>rT)||(anger>rT+.1),rY=(p2>yT)||(anger>yT+.1),lO=S.minred===0?true:(rms>=gv(S.minred));if(rR&&lO)redStreak++;else redStreak=0;const now=Date.now();let l;if(redStreak>=S.conf){l='red';holdUntil=now+S.hold*100}else if(now<holdUntil)l='red';else if(rY)l='yellow';else l='green';const ind=document.getElementById('indicator');ind.classList.remove('green','yellow','red');ind.classList.add(l);ind.textContent=l==='red'?'🔴':l==='yellow'?'🟡':'🟢';if(l==='red'&&redStreak>=S.conf)beep();document.getElementById('debug').textContent='RAW '+raw.map(v=>(v*100).toFixed(0)).join('/')+' SM '+sp.map(v=>(v*100).toFixed(0)).join('/')+' RMS '+rms.toFixed(4)+' '+ms+'ms\nпороги R>'+rT.toFixed(2)+' Y>'+yT.toFixed(2)+' streak '+redStreak+'/'+S.conf+' '+info}
async function startListening(){try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new AudioContext({sampleRate:SR});const src=audioContext.createMediaStreamSource(mediaStream),proc=audioContext.createScriptProcessor(4096,1,1),ring=new Float32Array(WIN);let wp=0,filled=0,lastT=0;proc.onaudioprocess=(e)=>{if(!isRunning)return;const inp=e.inputBuffer.getChannelData(0);for(let i=0;i<inp.length;i++){ring[wp]=inp[i];wp=(wp+1)%WIN;filled++}let ir=0;for(let i=0;i<inp.length;i++)ir+=inp[i]*inp[i];ir=Math.sqrt(ir/inp.length);document.getElementById('vol-fill').style.width=Math.min(100,ir*1200)+'%';const now=Date.now();if(filled>=WIN&&now-lastT>=S.rate){lastT=now;const full=new Float32Array(WIN);for(let i=0;i<WIN;i++)full[i]=ring[(wp+i)%WIN];let wr=0;for(let i=0;i<WIN;i++)wr+=full[i]*full[i];wr=Math.sqrt(wr/WIN);if(wr<gv(S.gate)){document.getElementById('debug').textContent='🔇 Тишина RMS='+wr.toFixed(4);redStreak=0;return}predict(S.vad?vadCrop(full):full,wr,S.vad?'[VAD]':'')}};src.connect(proc);proc.connect(audioContext.destination);isRunning=true;document.getElementById('startBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';document.getElementById('status').textContent='🎤 Слушаю...'}catch(e){document.getElementById('status').textContent='❌ '+e.message;alert('Ошибка: '+e.message)}}
function stopListening(){isRunning=false;if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(audioContext)audioContext.close();document.getElementById('startBtn').style.display='inline-block';document.getElementById('stopBtn').style.display='none';document.getElementById('status').textContent='⏸ Остановлено';const ind=document.getElementById('indicator');ind.className='';ind.textContent='⚪';smoothProbs=[1,0,0];redStreak=0;holdUntil=0}
document.getElementById('startBtn').onclick=startListening;document.getElementById('stopBtn').onclick=stopListening;loadModel();
</script>
